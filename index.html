<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Nova College - Sign In</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        display: flex;
        height: 100vh;
    }

    /* Linkerzijde met fotocollage */
    .left {
        width: 66%;
        background: url("./novawelcome.png") center/cover no-repeat;
        filter: grayscale(100%);
    }

    /* Midden met WELKOM */
    /* .middle {
        width: 33%;
        background-color: #0097a7;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 60px;
        font-weight: bold;
        text-transform: uppercase;
    } */
    

    /* Rechterzijde login */
    .right {
        width: 34%;
        background-color: white;
        padding: 60px;
        box-shadow: -5px 0 10px rgba(0,0,0,0.1);
    }

    .logo {
        width: 140px;
        margin-bottom: 20px;
    }

    .login-title {
        font-size: 18px;
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 16px;
    }

    button {
        width: 100%;
        padding: 12px;
        background-color: #0078d4;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 18px;
        cursor: pointer;
    }

    button:hover {
        background-color: #005fa3;
    }

    .note {
        margin-top: 20px;
        font-size: 14px;
        color: #444;
        line-height: 1.4;
    }
</style>

</head>
<body>

<div class="left"></div>

<!-- <div class="middle">
    WELKOM
</div> -->

<div class="right">
    <img class="logo" src="./novalogo.png" alt="Nova College Logo">

    <div class="login-title">Sign in with your organizational account</div>

    <input type="text" id="email" placeholder="studentnummer@novacollege.nl">
    <input type="password" id="password" placeholder="Password">

    <button onclick="alert('⚠️ DIT WAS EEN SIMULATIE ⚠️\n\nWe hebben je account “gehackt”.\nJe ziet hoe snel dit kan gebeuren wanneer je op een link klikt.\n\nKlik nooit zomaar op links in e-mails!')">
        Sign in
    </button>

    <div class="note">
        <strong>Let op!</strong> Gebruik niet je e-mailadres.<br>
        Voorbeeld juiste gebruikersnaam:<br>
        [stamnummer]@novacollege.nl (student) of<br>
        [gebruikersnaam]@novacollege.nl (medewerker)
    </div>
</div>

</body>
</html>
