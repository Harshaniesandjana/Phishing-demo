<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Nova College - Sign In</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        font-family: "Times New Roman", Times, serif;
        background-color: #f2f2f2;
        display: flex;
        height: 100vh;
    }

    /* Linkerzijde met fotocollage */
    .left {
        width: 75%;
        background: url("./novawelcome.png") center/cover no-repeat;
        filter: color(100%);
    }

    /* Rechterzijde login */
    .right {
        width: 25%;
        background-color: white;
        padding: 60px;
        box-shadow: -5px 0 10px rgba(0,0,0,0.1);
    }

    .logo {
        width: 140px;
        margin-bottom: 20px;
    }

    .login-title {
        font-size: 16px;
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 16px;
    }

    button {
        width: 80%;
        padding: 10px;
        background-color: #0078d4;
        color: white;
        border: none;
        border-radius: 3px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background-color: #005fa3;
    }

    .note {
        margin-top: 100px;
        font-size: 12px;
        color: #444;
        line-height: 1.4;
    }
</style>

</head>
<body>

<div class="left"></div>

<div class="right">
    <img class="logo" src="./novalogo.jpg" alt="Nova College Logo">

    <div class="login-title">Sign in with your organizational account</div>

    <input type="text" id="email" placeholder="studentnummer@novacollege.nl">
    <input type="password" id="password" placeholder="Password">

    <button onclick="alert('⚠️DIT WAS EEN SIMULATIE⚠️\n\nJe hebt zojuist jouw gegevens ingevoerd op een pagina die niet echt is.\nIn een echte situatie hadden we nu toegang gehad tot jouw account.\n\nDit laat zien hoe snel en makkelijk jouw gegevens buitgemaakt kunnen worden wanneer je op een link klikt zonder te controleren of deze echt is.\nDenk altijd na voordat je ergens inlogt.')">
        Sign in
    </button>
    
    <div class="note">
        <strong>Let op!</strong> Gebruik niet je e-mailadres.<br>
        Voorbeeld juiste gebruikersnaam:<br>
        [stamnummer]@novacollege.nl (student) of<br>
        [gebruikersnaam]@novacollege.nl (medewerker)
    </div>
</div>

</body>
</html>
